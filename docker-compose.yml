version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miscuentas
      POSTGRES_PASSWORD: miscuentas
      POSTGRES_DB: miscuentas
    volumes:
      - miscuentas_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miscuentas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://miscuentas:miscuentas@db:5432/miscuentas?schema=public
    ports:
      - "4000:4000"

volumes:
  miscuentas_db_data:
